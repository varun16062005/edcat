services:
  - type: web
    name: ecdat-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 300 --workers 1
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
